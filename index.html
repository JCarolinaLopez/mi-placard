<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5d2f55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Placard">
<title>Mi Placard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
  :root {
    --bg: #f1ece4; --shell: #faf7f2; --panel: #ffffff; --panel-2: #f3eee6; --line: #e0d7ca;
    --fg: #2d2622; --muted: #7d7067; --accent: #5d2f55; --accent-soft: #ead9e6; --accent-fg: #ffffff;
    --ok: #5f7a3f; --ok-soft: #e3ead6; --warn: #b4582e; --warn-soft: #f6e0d3; --outline: #3a302a;
    --shadow: 0 6px 20px rgba(60, 40, 30, .10);
    --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "Karla", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17141a; --shell: #1f1b22; --panel: #272229; --panel-2: #2f2933; --line: #3d3542;
      --fg: #ece6e8; --muted: #a399a1; --accent: #c98fc0; --accent-soft: #3d2b3a; --accent-fg: #1a1218;
      --ok: #a4c47c; --ok-soft: #2d3a22; --warn: #e4906a; --warn-soft: #432a1e; --outline: #e8e0e4;
      --shadow: 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top, 0px); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }

  .shell { height: 100%; max-width: 460px; margin: 0 auto; background: var(--shell); display: flex; flex-direction: column; box-shadow: var(--shadow); }
  header.top { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
  header.top h1 { margin: 0; font-family: var(--display); font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
  header.top .sub { font-size: .8rem; color: var(--muted); }
  .icon-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
  .icon-btn svg { width: 18px; height: 18px; }

  main { flex: 1; overflow-y: auto; padding: 14px 16px 24px; min-width: 0; -webkit-overflow-scrolling: touch; }
  .tab { display: flex; flex-direction: column; gap: 16px; }
  h2 { font-family: var(--display); font-size: 1.05rem; font-weight: 600; margin: 0; text-wrap: balance; }
  h3 { font-family: var(--display); font-size: .95rem; font-weight: 600; margin: 0; }
  .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: .85rem; }
  p { margin: 0; }

  nav.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--shell); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabbar button { background: none; border: 0; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .02em; }
  nav.tabbar button svg { width: 22px; height: 22px; }
  nav.tabbar button.active { color: var(--accent); }

  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: .9rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg); }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 10px; }
  .btn.ghost { background: transparent; }
  .btn.block { width: 100%; }
  .btn.big { padding: 16px; font-size: 1rem; border-radius: 16px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 18px; height: 18px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: .8rem; font-weight: 500; }
  .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .scrollx { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card.soft { background: var(--panel-2); border-style: dashed; }
  .badge { font-size: .7rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }

  .tile { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden; max-width: 100%; border: 1px solid var(--line); }
  .tile svg { width: 62%; height: 62%; }
  .tile svg path { stroke: var(--outline); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--panel); }
  .tile .lab { position: absolute; left: 6px; right: 6px; bottom: 5px; font-size: .62rem; font-weight: 700; line-height: 1.15; text-align: center; color: var(--fg); background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 6px; padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .collage { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .collage.c3 { grid-template-columns: repeat(3, 1fr); }
  .collage.c2 { grid-template-columns: repeat(2, 1fr); }
  .collage.c5 { grid-template-columns: repeat(5, 1fr); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .garment { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
  .garment .name { font-size: .78rem; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .garment .meta { display: flex; gap: 4px; align-items: center; justify-content: space-between; }
  .garment.dim { opacity: .55; }
  .dots { display: inline-flex; gap: 2px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); display: inline-block; }
  .dots i.f { background: var(--accent); }

  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .day { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 5px; align-items: center; min-width: 0; }
  .day .d { font-size: .7rem; font-weight: 700; color: var(--muted); }
  .day.today .d { color: var(--accent); }
  .day .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 100%; }
  .day .mini .tile { border-radius: 5px; }
  .day .mini .tile svg { width: 70%; height: 70%; }
  .day .empty { width: 100%; aspect-ratio: 1; border: 1px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: .8rem; }

  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 500; }
  .switch input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; margin: 0; transition: background .2s; flex: 0 0 auto; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(16px); }

  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 12, 18, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--shell); width: 100%; max-width: 460px; max-height: 90%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .sheet .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: .78rem; font-weight: 700; color: var(--muted); }
  .field input[type=text], .field input[type=number], .field select, .field textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 11px; width: 100%; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
  .sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .picker { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; }
  .picker button { flex: 0 0 68px; background: none; border: 0; padding: 0; }
  .picker button .tile { border: 2px solid var(--line); }
  .picker button.on .tile { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .photo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .photo-row input[type=text] { flex: 1; min-width: 160px; }
  .photo-box { width: 120px; }
  .photo-box .tile { border-radius: 14px; }

  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stepper button { width: 38px; height: 38px; border: 0; background: var(--panel); font-size: 1.1rem; font-weight: 700; }
  .stepper span { min-width: 56px; text-align: center; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }

  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .check:last-child { border-bottom: 0; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: 0 0 auto; }
  .check.done span { text-decoration: line-through; color: var(--muted); }
  .check .mini-tile { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; border: 1px solid var(--line); flex: 0 0 auto; position: relative; overflow: hidden; }
  .check .mini-tile svg { width: 70%; height: 70%; }
  .check .mini-tile svg path { stroke: var(--outline); stroke-width: 2.5; stroke-linejoin: round; }
  .check .mini-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-family: var(--display); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats .card { padding: 10px 12px; }
  .list { display: flex; flex-direction: column; }
  .list .item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .list .item:last-child { border-bottom: 0; }
  .list .item .mini-tile { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); position: relative; overflow: hidden; display: grid; place-items: center; flex: 0 0 auto; }
  .list .item .mini-tile svg { width: 70%; height: 70%; }
  .list .item .mini-tile svg path { stroke: var(--outline); stroke-width: 2.5; }
  .list .item .mini-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .queue { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .queue .tile img { object-fit: cover; }
  .queue .tile.done::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(95,122,63,.55); color: #fff; font-weight: 700; font-size: 1.4rem; }

  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .85rem; box-shadow: var(--shadow); z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .note { font-size: .78rem; color: var(--muted); text-align: center; padding: 6px 0 0; }
  .link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; text-decoration: underline; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Mi Placard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="row" style="gap:6px">
      <select class="btn small" id="season" aria-label="Temporada" style="padding:6px 10px;border-radius:999px">
        <option value="auto">Auto</option>
        <option value="primavera">Primavera</option>
        <option value="verano">Verano</option>
        <option value="otoño">Otoño</option>
        <option value="invierno">Invierno</option>
      </select>
      <button class="icon-btn" id="settings-btn" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button data-tab="placard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M7 8v2M17 8v2"/></svg>Placard</button>
    <button data-tab="looks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l4-3 4 3 4-3 4 3v13H4z"/><path d="M12 4v16"/></svg>Looks</button>
    <button data-tab="viajes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M9 11v6M15 11v6"/></svg>Viajes</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const KEY = 'mi-placard-v1';
  const SEASONS = ['primavera', 'verano', 'otoño', 'invierno'];
  const CATS = { top: 'Tops', bottom: 'Abajo', dress: 'Vestidos', outer: 'Abrigos', shoes: 'Calzado', acc: 'Accesorios' };
  const CAT1 = { top: 'Top', bottom: 'Parte de abajo', dress: 'Vestido', outer: 'Abrigo', shoes: 'Calzado', acc: 'Accesorio' };
  const CAT_ORDER = ['top', 'bottom', 'dress', 'outer', 'shoes', 'acc'];
  const FORMAL = { 1: 'Casual', 2: 'Oficina', 3: 'Reunión' };
  const HUES = {
    blanco: { hex: '#f4f1ec', n: true }, negro: { hex: '#1c1b1b', n: true }, gris: { hex: '#8a8a8f', n: true },
    marino: { hex: '#22304d', n: true }, beige: { hex: '#e2d3b6', n: true }, camel: { hex: '#bf8f5c', n: true },
    denim: { hex: '#3b4f72', n: true }, nude: { hex: '#d7b89a', n: true }, marron: { hex: '#5a3d2b', n: true },
    terracota: { hex: '#b5563a', n: false }, oliva: { hex: '#6b7a45', n: false }, bordo: { hex: '#6e2b3a', n: false },
    celeste: { hex: '#9bbbd4', n: false }, lila: { hex: '#9f6b8c', n: false }, rojo: { hex: '#b8232f', n: false },
    verde: { hex: '#2f6b4f', n: false }, amarillo: { hex: '#e2b640', n: false }, rosa: { hex: '#e3a5b4', n: false },
    azul: { hex: '#2d5fa8', n: false }, estampado: { hex: '#8d7f96', n: false }
  };
  const ALLOWED = new Set(['oliva|terracota', 'celeste|terracota', 'lila|oliva', 'bordo|celeste', 'bordo|rosa', 'azul|rojo', 'amarillo|azul', 'azul|verde', 'celeste|rosa', 'oliva|rosa', 'bordo|verde']);
  const SEASON_TEMP = { primavera: 18, verano: 28, otoño: 15, invierno: 9 };
  const WARM = ['primavera', 'verano'], COLD = ['otoño', 'invierno'];
  const EXTRAS = ['Ropa interior y medias', 'Pijama', 'Neceser', 'Cargador y auriculares', 'Documentos y tarjetas'];

  // ---------- state ----------
  function freshState() {
    return { items: [], looks: [], worn: {}, capsules: [], checks: {}, tab: 'hoy', onlySeason: true, catFilter: 'all', meeting: false, nextId: 1,
      settings: { season: 'auto', city: '', lat: null, lon: null }, weather: null, demo: false };
  }
  let state;
  try { const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
  if (!state || !state.items) state = freshState();
  state.settings = Object.assign({ season: 'auto', city: '', lat: null, lon: null }, state.settings || {});
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('No se pudo guardar: el almacenamiento está lleno o bloqueado'); } }

  // ---------- photos in IndexedDB ----------
  const photos = new Map();
  let db = null;
  function openDb() {
    return new Promise(res => {
      if (!('indexedDB' in window)) return res(null);
      const req = indexedDB.open('mi-placard', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('photos');
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });
  }
  function dbPut(id, data) { return new Promise(res => { if (!db) return res(); const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(data, id); tx.oncomplete = res; tx.onerror = res; }); }
  function dbDel(id) { return new Promise(res => { if (!db) return res(); const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete = res; tx.onerror = res; }); }
  function dbAll() {
    return new Promise(res => {
      if (!db) return res();
      const tx = db.transaction('photos', 'readonly'); const st = tx.objectStore('photos');
      const req = st.openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { photos.set(c.key, c.value); c.continue(); } else res(); };
      req.onerror = () => res();
    });
  }
  async function setPhoto(id, data) { if (data) { photos.set(id, data); await dbPut(id, data); } else { photos.delete(id); await dbDel(id); } }

  // image helpers
  function fileToDataUrl(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
  function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
  async function shrink(src, max = 640) {
    const im = await loadImage(src);
    const s = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, c.width, c.height);

  async function fetchFromLink() {
    syncForm();
    if (!form.link) { toast('Pegá primero el link del producto'); return; }
    if (!/^https?:\/\//i.test(form.link)) form.link = 'https://' + form.link;
    form.busy = true; renderAddSheet();
    try {
      const { img, title } = await imageFromProductLink(form.link);
      if (!form.name && title) form.name = title.split(/[|\-–]/)[0].trim().slice(0, 40);
      try {
        const data = await fetchImageData(img);
        const { data: small, hue } = await shrink(data);
        form.photo = small; form.imgUrl = '';
        if (hue && !form.hueTouched) form.hue = hue;
      } catch (e) { form.imgUrl = img; form.photo = ''; }
      toast('Foto traída de la tienda');
    } catch (e) { toast('No pude sacar la foto de ese link. Probá sacarla vos o elegirla de la galería.'); }

    if (batch.step === 'shoot') {
      openSheet(`

  document.getElementById('settings-btn').addEventListener('click', settingsSheet);

  main.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'meeting') { state.meeting = t.checked; render(); }
    if (t.id === 'onlySeason') { state.onlySeason = t.checked; render(); }
    if (t.id === 'clima') capForm.clima = t.value;
    if (t.id === 'capMeeting') capForm.meeting = t.checked;
    if (t.dataset.check) { const c = state.checks[t.dataset.cap] || (state.checks[t.dataset.cap] = {}); c[t.dataset.check] = t.checked; t.closest('.check').classList.toggle('done', t.checked); save(); }
  });
  main.addEventListener('input', e => { if (e.target.id === 'dest') capForm.dest = e.target.value; });
  main.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (b.dataset.cat) { state.catFilter = b.dataset.cat; render(); return; }
    if (b.dataset.open) { garmentSheet(+b.dataset.open); return; }
    if (act === 'reshuffle') { suggestions = null; render(); toast('Nuevas opciones'); }
    if (act === 'wear') wear(suggestions[+b.dataset.k].items);
    if (act === 'undo-today') { delete state.worn[iso(new Date())]; suggestions = null; render(); }
    if (act === 'save-as-look') { const ids = state.worn[iso(new Date())]; state.looks.unshift({ id: 'l' + Date.now(), name: 'Look del ' + new Date().toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }), items: ids.slice() }); save(); toast('Guardado en Looks'); }
    if (act === 'add') addSheet();
    if (act === 'batch') batchSheet();
    if (act === 'settings') settingsSheet();
    if (act === 'go-placard') { state.tab = 'placard'; state.onlySeason = false; render(); }
    if (act === 'load-demo') loadDemo();
    if (act === 'clear-demo') clearDemo();
    if (act === 'build-look') lookSheet();
    if (act === 'suggest-with') { const i = byId(+b.dataset.id); closeSheet(); lookSheet({ [i.cat]: i.id }); }
    if (act === 'wear-look') { const l = state.looks.find(x => x.id === b.dataset.id); wear(l.items); state.tab = 'hoy'; render(); }
    if (act === 'del-look') { state.looks = state.looks.filter(x => x.id !== b.dataset.id); render(); }
    if (act === 'days') { capForm.days = Math.min(10, Math.max(2, capForm.days + (+b.dataset.d))); render(); }
    if (act === 'build-cap') { capResult = buildCapsule(capForm); render(); setTimeout(() => document.getElementById('cap-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
    if (act === 'save-cap') { state.capsules.unshift(capResult); toast('Cápsula guardada'); render(); }
    if (act === 'close-cap') { capResult = null; render(); }
    if (act === 'open-cap') { capResult = state.capsules.find(x => x.id === b.dataset.id); render(); setTimeout(() => document.getElementById('cap-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
    if (act === 'dup-cap') { const c = state.capsules.find(x => x.id === b.dataset.id); capForm = { days: c.days, dest: c.name.split(' · ')[0].replace(/^Viaje de \d+ días$/, ''), clima: c.clima, meeting: c.meeting }; capResult = buildCapsule(capForm); render(); toast('Cápsula rearmada con lo disponible hoy'); }
    if (act === 'del-cap') { state.capsules = state.capsules.filter(x => x.id !== b.dataset.id); delete state.checks[b.dataset.id]; if (capResult && capResult.id === b.dataset.id) capResult = null; render(); }
  });
  function wear(ids) {
    state.worn[iso(new Date())] = ids.slice();
    ids.forEach(id => { const i = byId(id); if (i) i.uses = (i.uses || 0) + 1; });
    suggestions = null; state.tab = 'hoy';
    render(); toast('Listo, anotado para hoy');
  }

  sheetRoot.addEventListener('change', async e => {
    const t = e.target;
    if ((t.id === 'f-cam' || t.id === 'f-file') && t.files[0]) handlePhotoFile(t.files[0]);
    if ((t.id === 'b-cam' || t.id === 'b-file') && t.files.length) addBatchFiles([...t.files]);
    if (t.id === 's-import' && t.files[0]) importAll(t.files[0]);
  });
  sheetRoot.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 's-city') { e.preventDefault(); setCity(); }
    if (e.key === 'Enter' && e.target.id === 'f-name' && form && form.batchItem) { e.preventDefault(); batchSave(); }
  });
  async function setCity() {
    const name = sheetRoot.querySelector('#s-city').value.trim(); if (!name) return;
    try { const r = await geocode(name); state.settings = Object.assign(state.settings, { city: r.name, lat: r.lat, lon: r.lon }); state.weather = null; save(); settingsSheet(); toast('Ciudad guardada: ' + r.name); refreshWeather(); }
    catch (e) { toast('No encontré esa ciudad'); }
  }
  function batchSave() {
    form.name = (sheetRoot.querySelector('#f-name')?.value || '').trim();
    if (!form.name) { toast('Ponele un nombre'); return; }
    if (!form.seasons.length) { toast('Elegí al menos una temporada'); return; }
    const id = state.nextId++;
    state.items.push({ id, name: form.name, cat: form.cat, hue: form.hue, seasons: form.seasons, formal: form.formal, state: 'ok', uses: 0 });
    setPhoto(id, form.photo);
    form.batchItem.done = true; batch.lastCat = form.cat;
    save(); toast('Guardada: ' + form.name); renderBatch();
  }
  sheetRoot.addEventListener('click', async e => {
    if (e.target.hasAttribute('data-close')) { closeSheet(); render(); return; }
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (b.dataset.state) { const i = byId(+b.dataset.id); i.state = b.dataset.state; closeSheet(); suggestions = null; render(); toast(b.dataset.state === 'lavado' ? 'Marcada en lavado' : b.dataset.state === 'guardada' ? 'Guardada de temporada' : 'Disponible de nuevo'); }
    if (act === 'del-item') {
      if (b.dataset.confirm) { const id = +b.dataset.id; state.items = state.items.filter(x => x.id !== id); await setPhoto(id, null); closeSheet(); suggestions = null; render(); toast('Prenda eliminada'); }
      else { b.textContent = '¿Seguro? Tocá de nuevo para eliminar'; b.dataset.confirm = '1'; }
    }
    if (act === 'edit-item') addSheet(+b.dataset.id);
    if (act === 'suggest-with') { const i = byId(+b.dataset.id); lookSheet({ [i.cat]: i.id }); }
    if (act === 'clear-img') { syncForm(); form.photo = ''; form.imgUrl = ''; renderAddSheet(); }
    if (act === 'fetch-link') fetchFromLink();
    if (b.dataset.f || b.dataset.bf) {
      const f = b.dataset.f || b.dataset.bf, v = b.dataset.v;
      if (b.dataset.f) syncForm(); else form.name = sheetRoot.querySelector('#f-name')?.value ?? form.name;
      if (f === 'season') { form.seasons = v === 'all' ? SEASONS.slice() : form.seasons.includes(v) ? form.seasons.filter(s => s !== v) : [...form.seasons, v]; }
      else if (f === 'formal') form.formal = +v; else { form[f] = v; if (f === 'hue') form.hueTouched = true; }
      if (b.dataset.f) renderAddSheet(); else rebatchChips();
    }
    if (act === 'save-item') {
      syncForm(); form.name = form.name.trim();
      if (!form.name) { toast('Ponele un nombre a la prenda'); return; }
      if (!form.seasons.length) { toast('Elegí al menos una temporada'); return; }
      if (form.link && !/^https?:\/\//i.test(form.link)) form.link = 'https://' + form.link;
      const data = { name: form.name, cat: form.cat, hue: form.hue, seasons: form.seasons, formal: form.formal, link: form.link, price: form.price ? +form.price : 0, imgUrl: form.imgUrl || '' };
      let id = form.id;
      if (id) Object.assign(byId(id), data); else { id = state.nextId++; state.items.push({ id, state: 'ok', uses: 0, ...data }); }
      await setPhoto(id, form.photo || null);
      closeSheet(); suggestions = null; if (!form.id) state.onlySeason = false; render(); toast(form.id ? 'Cambios guardados' : 'Prenda agregada');
    }
    if (act === 'batch-classify') { batch.step = 'classify'; renderBatch(); setTimeout(() => sheetRoot.querySelector('#f-name')?.focus(), 50); }
    if (act === 'batch-save') { batchSave(); setTimeout(() => sheetRoot.querySelector('#f-name')?.focus(), 50); }
    if (act === 'batch-skip') { form.batchItem.done = true; renderBatch(); }
    if (act === 'batch-end') { batch = null; closeSheet(); render(); }
    if (b.dataset.pick) {
      lookForm.name = sheetRoot.querySelector('#l-name')?.value ?? lookForm.name;
      const cat = b.dataset.pick, id = +b.dataset.id;
      lookForm.picks[cat] = lookForm.picks[cat] === id ? null : id;
      if (cat === 'dress' && lookForm.picks.dress) { lookForm.picks.top = null; lookForm.picks.bottom = null; }
      if ((cat === 'top' || cat === 'bottom') && lookForm.picks[cat]) lookForm.picks.dress = null;
      renderLookSheet();
    }
    if (act === 'save-look' || act === 'wear-picks') {
      const name = sheetRoot.querySelector('#l-name').value.trim() || 'Look sin nombre';
      const items = CAT_ORDER.map(c => lookForm.picks[c]).filter(Boolean);
      if (act === 'save-look') { state.looks.unshift({ id: 'l' + Date.now(), name, items }); closeSheet(); state.tab = 'looks'; render(); toast('Look guardado'); }
      else { closeSheet(); wear(items); }
    }
    if (act === 'set-city') setCity();
    if (act === 'export') exportAll();
    if (act === 'load-demo') { closeSheet(); loadDemo(); }
    if (act === 'wipe') {
      if (b.dataset.confirm) { for (const i of state.items) await setPhoto(i.id, null); state = freshState(); suggestions = null; capResult = null; closeSheet(); render(); toast('Todo borrado'); }
      else { b.textContent = '¿Seguro? Tocá de nuevo para borrar todo'; b.dataset.confirm = '1'; }
    }
  });
  // keep batch chips in sync without losing the typed name
  function rebatchChips() {
    sheetRoot.querySelectorAll('[data-bf]').forEach(el => {
      const f = el.dataset.bf, v = el.dataset.v;
      const on = f === 'cat' ? form.cat === v : f === 'hue' ? form.hue === v : f === 'formal' ? form.formal === +v : v !== 'all' && form.seasons.includes(v);
      el.classList.toggle('on', on);
    });
    const pv = sheetRoot.querySelector('.photo-box'); if (pv) pv.innerHTML = tile({ name: '', cat: form.cat, hue: form.hue, preview: form.photo }, false);
    const hueLabel = sheetRoot.querySelector('.swatches + .muted'); if (hueLabel) hueLabel.textContent = form.hue;
  }

  // ---------- boot ----------
  (async () => {
    db = await openDb();
    await dbAll();
    render();
    refreshWeather();
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    window.addEventListener('online', refreshWeather);
  })();
})();
</script>
</body>
</html>
